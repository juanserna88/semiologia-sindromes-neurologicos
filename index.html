<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedON Student · Semiología de los síndromes neurológicos prevalentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{
  /* Paleta MedON: verde profundo, acento claro, lienzo casi blanco */
  --ink:#04302B; --petrol:#04302B; --deep:#04302B; --green:#1D8446; --lime:#3CC168;
  --paper:#F4F8F6; --card:#ffffff; --line:#D3E4DC; --muted:#4A6660; --mint:#EAF6EE;
  --red:#d1453b; --amber:#e48a24; --blue:#2f86c4; --violet:#7a52b3;
  --brain:#f1d6cb; --brain2:#e8bfb1; --sulc:#a8695c; --wm:#fbf1ec;
  --font:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}

.app{display:grid;grid-template-columns:288px 1fr;grid-template-rows:auto 1fr;height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:5px 18px;background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.top .mark{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;min-width:0}
.top .lg{width:140px;height:54px;overflow:hidden;position:relative;flex:none}
.top .lg img{position:absolute;width:158px;left:-9px;top:-52px;mix-blend-mode:multiply;max-width:none}
.top .tt{display:flex;flex-direction:column;gap:3px;padding-left:14px;border-left:1px solid var(--line);text-align:left;min-width:0}

.top .t1{font-weight:700;font-size:15px;letter-spacing:.01em;color:var(--ink)}
.top .t2{font-family:var(--mono);font-size:10.5px;color:var(--green);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.top .sp{flex:1}
.top .menu{display:none;background:var(--mint);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 10px}
.top .menu svg{width:20px;height:20px;display:block}

.side{background:var(--petrol);color:#d7ebe2;overflow-y:auto;padding:14px 10px 30px}
.side .sec{margin:6px 0 12px}
.side .sh{display:flex;gap:10px;align-items:baseline;padding:6px 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--lime)}
.side .sh span{color:#8fb9a6}
.side button.it{display:block;width:100%;text-align:left;background:none;border:0;color:#e6f3ec;padding:7px 12px 7px 30px;border-radius:8px;font-size:13.5px;position:relative}
.side button.it::before{content:"";position:absolute;left:14px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#2F7A64}
.side button.it:hover{background:#0A463C}
.side button.it[aria-current="true"]{background:var(--green);color:#fff;font-weight:600}
.side button.it[aria-current="true"]::before{background:#fff}
.side .home{display:flex;gap:8px;align-items:center;width:100%;background:#0A463C;border:0;color:#fff;border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-bottom:8px}
.side .home svg{width:16px;height:16px}

main{overflow-y:auto;padding:22px 26px 40px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.hdr{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.hdr h1{font-size:34px;font-weight:800;color:var(--petrol);margin-top:4px}
.tabs{display:flex;gap:4px;background:#e3ece7;padding:4px;border-radius:12px}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:#fff;color:var(--petrol);box-shadow:0 1px 3px rgba(0,52,52,.15)}

.lab-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stage .cv{position:relative;background:radial-gradient(ellipse at 50% 40%,#ffffff 0%,#f3f7f4 70%,#e9f0ec 100%)}
.stage svg.scene{display:block;width:100%;height:auto}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.ctrl button.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--petrol)}
.ctrl button.ic:hover{border-color:var(--green)}
.ctrl button.ic.pri{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.ctrl button.ic svg{width:18px;height:18px}
.ctrl .prog{flex:1;min-width:120px;display:flex;gap:5px}
.ctrl .prog button{flex:1;height:8px;border-radius:4px;border:0;background:#dbe6e0;padding:0}
.ctrl .prog button.done{background:#9fd6b5}
.ctrl .prog button.cur{background:var(--green)}
.ctrl .cnt{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.ctrl .tg{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px}
.ctrl .tg[aria-pressed="true"]{background:var(--mint);border-color:#9fd6b5;color:var(--petrol)}
.ctrl .tg svg{width:15px;height:15px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 16px 12px;font-size:12px;color:var(--muted);min-height:24px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

.steps{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px}
.steps .st{display:block;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px 12px;color:var(--ink)}
.steps .st .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#e3ece7;color:var(--muted);font-size:12px;font-weight:700;margin-right:10px;flex:none}
.steps .st .h{display:flex;align-items:center;font-weight:600;font-size:14px}
.steps .st .d{display:none;margin:8px 0 2px 34px;font-size:13.5px;color:#36504c;max-width:62ch}
.steps .st .d b{color:var(--petrol)}
.steps .st[aria-current="true"]{background:var(--mint)}
.steps .st[aria-current="true"] .n{background:var(--green);color:#fff}
.steps .st[aria-current="true"] .d{display:block}
.steps .st.past .n{background:#bfe3cd;color:var(--petrol)}
.key{margin:8px 4px 4px;padding:12px 14px;border-radius:12px;background:var(--petrol);color:#fff;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.key svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--lime)}
.key b{color:var(--lime)}

.refs{margin-top:18px;font-size:11.5px;color:var(--muted);max-width:110ch}
.refs p{margin:2px 0}

/* Semiología y asociaciones */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.box.dark{background:var(--petrol);color:#e6f3ec;border-color:var(--petrol)}
.box h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:10px}
.box.dark h3{color:var(--lime)}
.box ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.box li{padding:9px 12px;border-radius:10px;background:var(--paper);font-weight:600;font-size:14px}
.box.dark li{background:#0d4646}
.box li small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:2px}
.box.dark li small{color:#a9cfbf}
.asoc{display:grid;gap:10px}
.asoc .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.asoc .chip{background:var(--mint);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.asoc .chip small{font-weight:400;color:var(--muted)}
.asoc .plus{color:var(--green);font-weight:700}
.asoc .arrow{margin-left:auto;display:flex;align-items:center;gap:8px}
.asoc .arrow svg{width:18px;height:18px;color:var(--green)}
.asoc .dx{background:var(--petrol);color:#fff;border-radius:20px;padding:6px 14px;font-weight:700;font-size:13.5px}
.asoc .dx.alarm{background:var(--red)}
.note{margin-top:14px;padding:12px 16px;border-radius:12px;background:#fff6ea;border:1px solid #f3d6ad;font-size:13.5px}

/* Inicio */
.hero{background:linear-gradient(160deg,#04302B 0%,#022320 100%);color:#fff;border-radius:22px;padding:46px 44px;display:grid;grid-template-columns:1fr auto;gap:48px;align-items:center;position:relative;overflow:hidden}
.hero h1{font-size:clamp(32px,4vw,52px);font-weight:800;letter-spacing:-.015em;line-height:1.06}
.hero .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);font-weight:600}
.hero .hl{padding:12px 0}
.hero .hbtn{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.hero .hbtn button{display:inline-flex;align-items:center;gap:10px;border-radius:30px;padding:12px 22px;font-size:15.5px;font-weight:600;border:0;transition:all .22s}
.hero .hbtn .b1{background:var(--lime);color:#04302B;box-shadow:0 10px 26px rgba(60,193,104,.26)}
.hero .hbtn .b1:hover{background:#56d47f;transform:translateY(-2px)}
.hero .hbtn .b1 .ico{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#04302B;color:var(--lime)}
.hero .hbtn .b1 .ico svg{width:13px;height:13px}
.hero .hbtn .b2{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.3)}
.hero .hbtn .b2:hover{background:rgba(255,255,255,.12)}
.orden{background:rgba(255,255,255,.04);border:1px solid rgba(60,193,104,.22);border-radius:20px;padding:18px;width:460px;max-width:100%}
.orden h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);font-weight:600;margin:2px 0 12px 4px}
.ord{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(60,193,104,.16);border-radius:13px;padding:11px 14px;margin-bottom:8px;color:#fff;transition:all .2s}
.ord:last-child{margin-bottom:0}
.ord:hover{background:rgba(60,193,104,.15);border-color:var(--lime)}
.ord .nn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--lime);color:#04302B;display:grid;place-items:center;font-size:13.5px;font-weight:700}
.ord .tx{flex:1;min-width:0}
.ord .tx b{display:block;font-size:14.5px;font-weight:700;line-height:1.25}
.ord .tx small{display:block;font-size:12.5px;color:#A9CCC2;line-height:1.3;margin-top:2px}
.ord .ar{flex:none;color:#7FB9A6;font-size:17px}
.ord:hover .ar{color:var(--lime)}
.hero h1 span{color:var(--lime)}
.hero p{color:#CBE3DB;max-width:52ch;margin:16px 0 0;font-size:16px}
.hero svg.hb{width:260px;height:auto}
.grid8{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card .num{font-size:26px;font-weight:800;color:var(--green);line-height:1}
.card h3{font-size:16px;color:var(--petrol);margin:6px 0 10px}
.card .chips{display:flex;flex-wrap:wrap;gap:6px}
.card .chips button{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--petrol)}
.card .chips button:hover{border-color:var(--green);background:var(--mint)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.how div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13.5px;color:#36504c;display:flex;gap:12px}
.how svg{width:22px;height:22px;color:var(--green);flex:none}
.how b{color:var(--petrol);display:block}

footer.mfoot{margin:34px -26px -40px;background:#022320;color:#cfe3dc;padding:38px 26px;text-align:center}
footer.mfoot .dis{font-size:15px;max-width:900px;margin:0 auto 12px;line-height:1.6;color:#D7E7E1}
footer.mfoot .ref{font-size:12.5px;opacity:.85;max-width:94ch;margin:0 auto 14px;line-height:1.6}
footer.mfoot .cr{font-family:var(--mono);font-size:13px;letter-spacing:.04em;opacity:.85;margin:0}
@media (max-width:860px){
  footer.mfoot{margin:28px -16px -40px;padding:28px 18px}
  .top{padding:5px 14px;gap:10px}
  .top .lg{width:104px;height:42px}
  .top .lg img{width:118px;left:-7px;top:-39px}
  .top .tt{padding-left:10px}
  .top .t1{font-size:13px}
  .top .t2{font-size:9.5px}
  .hero{padding:26px 20px;gap:24px}
  .hero h1{font-size:29px}
  .hero .eyebrow{font-size:11px;letter-spacing:.1em}
  .hero p{font-size:15px;margin-top:14px}
  .orden{width:100%;padding:14px}
  .ord{padding:10px 12px}
  .ord .tx b{font-size:13.5px}
  .ord .tx small{font-size:12px}
  .hero .hbtn button{width:100%;justify-content:center}
}
@media (max-width:1180px){.lab-grid{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .top .menu{display:block}
  .side{position:fixed;inset:var(--topH,66px) 0 0 0;z-index:20;transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none}
  main{padding:16px}
  .hdr h1{font-size:26px}
  .cols,.how{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}.hero svg.hb{display:none}
}

/* ===== SVG anatómico ===== */
svg.scene text{font-family:var(--font)}
.brain{fill:var(--brain);}
.edge{fill:none;stroke:#8f5a4f;stroke-width:2.4}
.reg{transition:fill .7s,opacity .7s,transform 1.4s cubic-bezier(.3,.7,.2,1),stroke .7s}
.lobe{fill:var(--brain)}
.area{fill:transparent}
.shade{pointer-events:none;mix-blend-mode:multiply}
.sulc{fill:none;stroke:var(--sulc);stroke-width:2.2;stroke-linecap:round;opacity:.75}
.fiss{fill:none;stroke:#7d4639;stroke-width:3.4;stroke-linecap:round}
.imag{fill:none;stroke:#b9877a;stroke-width:1.2;stroke-dasharray:3 4}
.stem,.pons,.med,.mid{fill:#ecc9bb;stroke:#8f5a4f;stroke-width:1.8}
.cb{fill:#e8b8a8;stroke:none}
.cbedge{fill:none;stroke:#8f5a4f;stroke-width:2}
.folia{fill:none;stroke:#b87a6b;stroke-width:1.3;opacity:.8}
.arbor{fill:none;stroke:#fbefe9;stroke-width:3.2;stroke-linecap:round}
.cc{fill:#f8ece6;stroke:#a36f62;stroke-width:1.6}
.septum{fill:#f7e7e0;stroke:none}
.fornix{fill:none;stroke:#f9efe9;stroke-width:6;stroke-linecap:round}
.v3,.v4,.vent,.ventc{fill:#bfe0f2;stroke:#5d9cc4;stroke-width:1.4}
.vent.opt{opacity:0}
.thal{fill:#ddb0a2;stroke:#8f5a4f;stroke-width:1.6}
.hypo{fill:#e3b9ab;stroke:#8f5a4f;stroke-width:1.3}
.chiasm{fill:#f4e4dc;stroke:#8f5a4f;stroke-width:1.3}
.pit{fill:#e9b2a6;stroke:#8f5a4f;stroke-width:1.4}
.stalk{fill:none;stroke:#b98172;stroke-width:4;stroke-linecap:round}
.mam{fill:#d9a797;stroke:#8f5a4f;stroke-width:1}
.pineal{fill:#d9a797;stroke:#8f5a4f;stroke-width:1}
.sn{fill:#3a2622;stroke:none}
.aque{fill:#bfe0f2;stroke:#5d9cc4;stroke-width:2.2}
path.aque{fill:none;stroke:#7fbbe0;stroke-width:3}
.olf{fill:none;stroke:#c99282;stroke-width:4;stroke-linecap:round}
.olfb{fill:#e4b4a5;stroke:#8f5a4f;stroke-width:1.2}
.cortex{fill:var(--wm);stroke:#dba898;stroke-width:28}
.gyr{fill:none;stroke:#dba898;stroke-width:11;stroke-linecap:round}
.sulc2{fill:none;stroke:#a8695c;stroke-width:1.6;stroke-linecap:round}
.sylv{fill:none;stroke:#a8695c;stroke-width:2.2;stroke-linecap:round}
.insula{fill:#dba898}
.cau,.put{fill:#d9a495;stroke:#8f5a4f;stroke-width:1.3}
.gp{fill:#e8c4b8;stroke:#8f5a4f;stroke-width:1.1}
.claus{fill:none;stroke:#d39d8e;stroke-width:3}
.hip{fill:#d39b8b;stroke:#8f5a4f;stroke-width:1.3}
.hipcurl{fill:none;stroke:#8f5a4f;stroke-width:1.2}
.septum2{stroke:#e9cfc6;stroke-width:3}
.fissline{stroke:#9b6356;stroke-width:2.4}
.skull{fill:none;stroke:#cbbfae;stroke-width:16}
.dura{fill:none;stroke:#7b8fa6;stroke-width:3}
.opt{opacity:0;transition:opacity .8s}
.opt.show{opacity:1}
.fibers .fb{fill:none;stroke-width:5;stroke-linecap:round;opacity:.9}
.fb.leg{stroke:#2f86c4}.fb.arm{stroke:#7a52b3}.fb.face{stroke:#e48a24}

/* etiquetas */
.lab{opacity:0;transition:opacity .5s;pointer-events:none}
.lab circle{fill:#04302B}
.lab path{stroke:#04302B;stroke-width:1;fill:none}
.lab text{font-size:12.5px;font-weight:600;fill:#04302B;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.labs-on .lab,.lab.show{opacity:1}

/* resaltados */
.reg.hl-r{fill:#e45b4f!important}.reg.hl-a{fill:#f2a54a!important}.reg.hl-g{fill:#4cc27a!important}
.reg.hl-b{fill:#5aa8dc!important}.reg.hl-v{fill:#9a76cf!important}.reg.hl-y{fill:#f5d34c!important}
.reg.hl-k{fill:#9a948f!important}.reg.hl-p{fill:#f1a3b7!important}
.lobe.hl-r,.lobe.hl-a,.lobe.hl-g,.lobe.hl-b,.lobe.hl-v,.lobe.hl-y,.lobe.hl-k,.area.hl-r,.area.hl-a,.area.hl-g,.area.hl-b,.area.hl-v,.area.hl-y,.area.hl-k{opacity:.82}
.reg.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.reg.dim{opacity:.35}
.reg.pale{fill:#c9b1a8!important}

/* superposiciones */
.ov{opacity:0;transition:opacity .7s;pointer-events:none}
.ov.on{opacity:1}
.vw{transition:opacity .7s}
.vw.off{opacity:0;pointer-events:none}
.flow{stroke-dasharray:6 10;animation:flow 1s linear infinite}
.flow.slow{animation-duration:2.2s}
@keyframes flow{to{stroke-dashoffset:-32}}
.blink{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-5px)}}
.throb{animation:throb 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes throb{50%{transform:scale(1.12)}}
.shake{animation:shake .22s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes shake{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.ovt{font-size:13px;font-weight:700;fill:#04302B}
.ovt.w{fill:#fff}
.ovt.s{font-size:11.5px;font-weight:600}
.ovt.big{font-size:17px}
.halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.tag rect{rx:8}
@media (prefers-reduced-motion:reduce){.flow,.blink,.spin,.bob,.throb,.shake,.reg.pulse{animation:none}}
.cut{fill:#f5e3db}
.arbor{fill:none;stroke:#fbefe9;stroke-linecap:round}
.arbor.a1{stroke-width:7}.arbor.a2{stroke-width:4}.arbor.a3{stroke-width:2.2}
.rn{fill:#c9706a;stroke:#8f5a4f;stroke-width:1}
.lobe#lat-front,.lobe#sag-front{fill:#f3d5c9}.lobe#lat-pariet,.lobe#sag-pariet,.lobe#sag-para{fill:#f2dcc8}

<div class="app">
  <header class="top"><button class="menu" aria-label="Abrir índice"></button><button class="mark" data-go=""></button><span class="sp"></span></header>

<script>/* ===== Geometría ===== */
const P = {
  cr(pts, closed) {
    const n = pts.length; if (n < 2) return '';
    const g = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
    let d = `M${pts[0][0]} ${pts[0][1]}`;
    const last = closed ? n : n - 1;
    for (let i = 0; i < last; i++) {
      const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += `C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`;
    }
    return d + (closed ? 'Z' : '');
  },
  seg(pts) { return P.cr(pts, false).replace(/^M[^C]*/, ''); },
  poly(pts) { return 'M' + pts.map(p => p.join(' ')).join('L') + 'Z'; },
  mir(pts, cx = 480) { return pts.map(([x, y]) => [2 * cx - x, y]); },
  rev(a) { return a.slice().reverse(); }
};

/* Etiqueta anatómica con línea guía */
function lab(id, x, y, lx, ly, t) {
  const end = lx < x ? 'end' : 'start';
  const tx = lx + (end === 'end' ? -5 : 5);
  const lines = t.split('|');
  const ts = lines.map((s, i) => `<tspan x="${tx}" dy="${i ? 13 : 0}">${s}</tspan>`).join('');
  return `<g class="lab" data-for="${id}"><circle cx="${x}" cy="${y}" r="2.6"/><path d="M${x} ${y}L${lx} ${ly}"/><text x="${tx}" y="${ly + 4 - (lines.length - 1) * 6}" text-anchor="${end}">${ts}</text></g>`;
}

/* ===== VISTA LATERAL (hemisferio izquierdo, frontal a la izquierda) ===== */
const LAT = (() => {
  const O = [[180,258],[180,212],[198,166],[234,126],[284,96],[342,76],[406,64],[472,60],[540,62],[606,74],[664,96],[714,126],[754,166],[782,212],[794,260],[790,306],[770,342],[732,360],[688,362],[650,356],[620,360],[594,372],[562,392],[522,406],[472,412],[422,410],[380,400],[348,384],[326,362],[316,338],[308,318],[280,312],[240,308],[206,296]];
  const S = [[312,322],[360,306],[410,294],[470,277],[512,262],[550,248],[574,236],[590,220]];
  const C = [[548,62],[540,92],[524,122],[526,156],[512,190],[502,222],[486,252],[470,277]];
  const J = [676,242], PO = [712,126], PN = [640,357];
  const sul = [
    [[505,66],[494,100],[480,132],[482,165],[468,200],[456,232],[444,258]],
    [[594,78],[582,112],[566,142],[568,176],[556,210],[548,234]],
    [[480,112],[430,108],[372,116],[312,138],[262,170]],
    [[466,192],[420,190],[362,198],[302,216],[250,240]],
    [[396,295],[386,268],[392,246]],[[372,300],[352,282]],
    [[574,162],[620,152],[662,160],[700,180],[728,212]],
    [[352,344],[410,330],[470,316],[530,298],[580,280],[622,262],[652,246]],
    [[384,386],[442,375],[502,360],[560,344],[612,332]],
    [[700,276],[738,288],[774,306]],[[716,198],[742,232]],[[652,246],[668,226],[690,238]],
    [[612,198],[626,212]],[[230,206],[262,196]],[[742,330],[770,320]]
  ];
  const lobes = {
    'lat-front': `M0 0L548 0L548 62${P.seg(C)}${P.seg(P.rev(S.slice(0, 4)))}L0 330Z`,
    'lat-pariet': `M548 0L712 0L${PO}L${J}L590 220${P.seg(P.rev(S.slice(3)))}${P.seg(P.rev(C))}Z`,
    'lat-occ': `M712 0L960 0L960 560L640 560L${PN}L${J}L${PO}Z`,
    'lat-temp': `M0 330L312 322${P.seg(S)}L${J}L${PN}L640 560L0 560Z`
  };
  // Áreas funcionales (recortadas por el contorno)
  const areas = {
    'lat-motor': P.cr([[548,62],[540,92],[524,122],[526,156],[512,190],[502,222],[486,252],[470,277],[444,258],[456,232],[468,200],[482,165],[480,132],[494,100],[505,66]], true),
    'lat-sens': P.cr([[548,62],[594,78],[582,112],[566,142],[568,176],[556,210],[548,234],[530,258],[486,252],[502,222],[512,190],[526,156],[524,122],[540,92]], true),
    'lat-broca': P.cr([[352,290],[376,276],[396,262],[420,262],[436,278],[420,292],[380,300]], true),
    'lat-wern': P.cr([[540,290],[580,276],[618,262],[640,262],[636,286],[600,300],[556,306]], true),
    'lat-pref': P.cr([[200,190],[250,130],[330,92],[420,80],[470,120],[456,200],[420,250],[340,290],[260,300],[200,270]], true),
    'lat-vis': P.cr([[730,250],[770,230],[800,260],[796,320],[770,350],[730,352],[720,300]], true),
    'lat-anttemp': P.cr([[318,338],[340,312],[380,306],[420,318],[430,360],[410,398],[370,398],[336,380]], true),
    'lat-aca': P.poly([[150,0],[760,0],[744,138],[700,122],[620,104],[540,92],[460,94],[390,104],[318,126],[250,162],[180,204]]),
    'lat-pca': P.poly([[728,170],[960,120],[960,560],[560,560],[560,404],[600,386],[640,370],[690,330],[720,290]]),
    'lat-mca': 'M0 0H960V560H0Z'
  };
  const cereb = [[600,378],[632,360],[680,356],[728,362],[766,378],[790,404],[784,436],[756,460],[712,474],[662,474],[624,462],[600,438],[592,408]];
  let folia = '';
  for (let y = 352; y < 484; y += 7) folia += `M586 ${y}Q680 ${y + 26} 800 ${y + 4}`;
  const stem = 'M552 386C538 404 536 436 552 456C560 472 564 500 566 530L568 560L590 560L590 530C592 500 596 474 602 458C614 438 614 408 606 386Z';
  function build() {
    let s = `<defs><clipPath id="lat-clip"><path d="${P.cr(O, true)}"/></clipPath><clipPath id="lat-cbclip"><path d="${P.cr(cereb, true)}"/></clipPath></defs>`;
    s += `<path class="reg stem" id="lat-stem" d="${stem}"/>`;
    s += `<path class="reg pons" id="lat-pons" d="M552 386C538 404 536 436 552 456C568 466 590 466 602 458C614 438 614 408 606 386Z"/><path class="sulc" d="M552 456Q577 468 602 458"/>`;
    s += `<path class="reg cb" id="lat-cereb" d="${P.cr(cereb, true)}"/><path class="folia" clip-path="url(#lat-cbclip)" d="${folia}"/><path class="cbedge" d="${P.cr(cereb, true)}"/>`;
    s += `<path class="brain" d="${P.cr(O, true)}"/><g clip-path="url(#lat-clip)"><rect class="brain" width="960" height="560"/>`;
    for (const k in lobes) s += `<path class="reg lobe" id="${k}" d="${lobes[k]}"/>`;
    for (const k in areas) s += `<path class="reg area" id="${k}" d="${areas[k]}"/>`;
    s += `<path class="shade" d="M0 0H960V560H0Z" fill="url(#gShade)"/>`;
    s += sul.map(p => `<path class="sulc" d="${P.cr(p)}"/>`).join('');
    s += `<path class="fiss" d="${P.cr(C)}"/><path class="fiss" d="${P.cr(S)}"/>`;
    s += `<path class="imag" d="M${PO}L${J}L${PN}M${J}L590 220"/></g>`;
    s += `<path class="edge" d="${P.cr(O, true)}"/>`;
    return s;
  }
  const labels = [
    lab('lat-front', 300, 170, 150, 92, 'Lóbulo frontal'),
    lab('lat-pariet', 640, 150, 790, 92, 'Lóbulo parietal'),
    lab('lat-occ', 760, 270, 820, 222, 'Lóbulo occipital'),
    lab('lat-temp', 470, 370, 420, 470, 'Lóbulo temporal'),
    lab('lat-cereb', 730, 440, 830, 480, 'Cerebelo'),
    lab('lat-pons', 570, 430, 500, 500, 'Tronco encefálico'),
    lab('lat-motor', 496, 200, 330, 40, 'Giro precentral|(corteza motora)'),
    lab('lat-sens', 556, 196, 640, 32, 'Giro poscentral|(sensitiva)'),
    lab('lat-broca', 392, 284, 190, 340, 'Área de Broca'),
    lab('lat-wern', 604, 286, 700, 515, 'Área de Wernicke'),
    lab('lat-vis', 776, 306, 820, 330, 'Corteza visual'),
    lab('lat-anttemp', 356, 366, 220, 420, 'Temporal anterior'),
    lab('lat-pref', 270, 230, 160, 236, 'Corteza prefrontal'),
    lab('lat-csul', 534, 108, 452, 20, 'Surco central'),
    lab('lat-sylv', 340, 312, 240, 482, 'Cisura lateral|(de Silvio)')
  ];
  return { build, labels, O, S, C };
})();

/* ===== VISTA SAGITAL MEDIA (frontal a la izquierda) ===== */
const SAG = (() => {
  const O = [[180,258],[180,212],[198,166],[234,126],[284,96],[342,76],[406,64],[472,60],[540,62],[606,74],[664,96],[714,126],[754,166],[782,212],[794,260],[790,306],[770,338],[732,354],[686,354],[640,350],[600,352],[560,362],[520,372],[470,376],[420,370],[384,354],[356,334],[328,318],[280,312],[240,308],[206,296]];
  const CC = [[338,250],[334,224],[350,200],[384,184],[440,175],[510,174],[568,180],[610,194],[636,216],[642,240],[630,258],[606,262],[598,246],[586,226],[556,212],[506,206],[446,208],[398,216],[372,232],[364,252],[372,270],[390,284],[372,286],[350,272]];
  const cing = [[322,272],[312,230],[330,188],[378,158],[450,144],[530,144],[592,154],[626,176]];
  const sul = [
    [[626,176],[640,140],[650,100],[654,74]], [[522,144],[522,104],[528,70]], [[566,62],[572,86]],
    [[640,244],[680,200],[708,152],[720,122]], [[640,254],[690,268],[740,280],[792,286]],
    [[298,190],[320,150],[360,118]], [[250,230],[262,190]], [[700,320],[740,330],[776,322]], [[420,92],[470,108]]
  ];
  const regs = {
    'sag-front': P.poly([[0,0],[524,0],[522,104],[520,146],[450,146],[380,160],[332,190],[312,230],[318,268],[340,300],[0,330]]),
    'sag-para': P.poly([[524,0],[654,0],[650,96],[640,140],[626,176],[590,156],[530,146],[520,146],[522,104]]),
    'sag-pariet': P.poly([[654,0],[730,0],[720,122],[708,152],[680,200],[640,244],[626,176],[640,140],[650,96]]),
    'sag-occ': P.poly([[730,0],[960,0],[960,560],[640,560],[640,244],[680,200],[708,152],[720,122]]),
    'sag-vis': P.cr([[642,250],[690,240],[750,246],[800,262],[800,312],[760,334],[700,320],[650,276]], true),
    'sag-cing': P.cr([[320,272],[312,230],[330,190],[378,160],[450,146],[530,146],[592,156],[626,178],[644,240],[606,240],[580,214],[506,204],[420,210],[372,232],[362,262],[372,292]], true),
    'sag-temp': P.poly([[330,330],[470,330],[640,330],[640,560],[0,560],[0,340]]),
    'sag-orb': P.cr([[200,280],[240,268],[300,270],[340,296],[330,322],[260,316],[206,300]], true)
  };
  const vent = [[352,238],[372,214],[420,204],[500,200],[570,208],[612,226],[650,248],[676,268],[652,274],[620,264],[604,276],[594,302],[570,330],[524,348],[486,344],[500,330],[540,314],[566,292],[566,268],[540,250],[480,244],[420,248],[384,260],[360,262]];
  const cb = [[582,362],[630,350],[690,354],[734,372],[758,404],[750,442],[716,468],[662,478],[616,470],[588,448],[574,420],[576,392]];
  // Árbol de la vida: tronco desde el techo del IV ventrículo y ramas en abanico hacia las folias
  function arbor() {
    const cx = 616, cy = 410; let thick = '', mid = '', thin = '';
    const E = (a, r) => [cx + Math.cos(a) * r * 1.18, cy + Math.sin(a) * r * 0.8];
    const angs = [-2.35, -1.95, -1.55, -1.15, -0.75, -0.35, 0.05, 0.45, 0.85, 1.25, 1.62];
    angs.forEach((a, i) => {
      const L = 108 - Math.abs(i - 5) * 4;
      const [x1, y1] = E(a, L * 0.55), [x2, y2] = E(a, L * 0.9);
      thick += `M${cx} ${cy}L${x1.toFixed(1)} ${y1.toFixed(1)}`;
      mid += `M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}`;
      for (const k of [-0.16, 0.16]) {
        const [bx, by] = E(a + k, L * 0.72), [ex, ey] = E(a + k * 1.9, L * 0.92);
        thin += `M${bx.toFixed(1)} ${by.toFixed(1)}L${ex.toFixed(1)} ${ey.toFixed(1)}`;
      }
    });
    return `<path class="arbor a1" d="${thick}"/><path class="arbor a2" d="${mid}"/><path class="arbor a3" d="${thin}"/>`;
  }
  function foliaRim() {
    let s = '';
    for (let a = -2.6; a < 1.9; a += 0.11) {
      const x1 = 616 + Math.cos(a) * 140, y1 = 410 + Math.sin(a) * 74, x2 = 616 + Math.cos(a) * 108, y2 = 410 + Math.sin(a) * 56;
      s += `M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}`;
    }
    return s;
  }
  function build() {
    let s = `<defs><clipPath id="sag-clip"><path d="${P.cr(O, true)}"/></clipPath><clipPath id="sag-cbclip"><path d="${P.cr(cb, true)}"/></clipPath></defs>`;
    s += `<g class="opt" id="sag-sas"><path d="${P.cr(O, true)}" fill="none" stroke="#d6ecf8" stroke-width="30" stroke-linejoin="round"/><path d="${P.cr(cb, true)}" fill="none" stroke="#d6ecf8" stroke-width="30"/><path d="M546 440L540 560M520 560L520 440" stroke="#d6ecf8" stroke-width="30"/></g>`;
    s += `<g class="opt" id="sag-sss"><path d="M246 128C296 62 418 30 520 30C642 32 742 80 800 170C822 220 826 280 812 334" fill="none" stroke="#5a6fa0" stroke-width="10" stroke-linecap="round"/>${[[400,38],[470,32],[540,32],[610,40],[680,60]].map(([x,y])=>`<path class="gran" d="M${x-6} ${y+14}q0 -10 6 -14q6 4 6 14z" fill="#e6f3fb" stroke="#5d9cc4" stroke-width="1.2"/>`).join('')}</g>`;
    s += `<path class="brain" d="${P.cr(O, true)}"/><g clip-path="url(#sag-clip)"><rect class="brain" width="960" height="560"/><path class="cut" d="${P.cr([[330,300],[372,290],[410,300],[440,340],[400,370],[350,340]], true)}"/>`;
    for (const k in regs) s += `<path class="reg ${k === 'sag-vis' || k === 'sag-orb' ? 'area' : 'lobe'}" id="${k}" d="${regs[k]}"/>`;
    s += `<path class="shade" d="M0 0H960V560H0Z" fill="url(#gShade)"/>`;
    s += sul.map(p => `<path class="sulc" d="${P.cr(p)}"/>`).join('');
    s += `<path class="fiss" d="${P.cr(cing)}"/></g><path class="edge" d="${P.cr(O, true)}"/>`;
    // ventrículos (proyección) – opcional

/* Utilidades para dibujar superposiciones */
const U = {
  // caja de texto: x,y esquina sup izq
  tag(x, y, t, o = {}) {
    const fs = o.fs || 13, lines = t.split('|'), pad = 9;
    const w = o.w || Math.max(...lines.map(l => l.length)) * fs * 0.56 + pad * 2;
    const h = lines.length * (fs + 4) + pad * 1.4;
    const fill = o.fill || '#fff', col = o.col || '#04302B', st = o.stroke || (o.fill ? 'none' : '#d9e4de');
    const tx = o.c ? x + w / 2 : x + pad;
    return `<g class="tag" filter="url(#drop)"><rect x="${x}" y="${y}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" rx="9" fill="${fill}" stroke="${st}"/>` +
      lines.map((l, i) => `<text x="${tx.toFixed(0)}" y="${(y + pad + fs - 1 + i * (fs + 4)).toFixed(0)}" ${o.c ? 'text-anchor="middle"' : ''} font-size="${fs}" font-weight="${i === 0 && !o.plain ? 700 : 500}" fill="${col}">${l}</text>`).join('') + `</g>`;
  },
  ov(st, inner, extra = '') { return `<g class="ov" data-st="${st}" ${extra}>${inner}</g>`; },
  // partículas que recorren una trayectoria
  dots(d, n, dur, r, fill, extra = '') {
    let s = '';
    for (let i = 0; i < n; i++) s += `<circle r="${r}" fill="${fill}" ${extra}><animateMotion dur="${dur}s" repeatCount="indefinite" begin="${(-dur * i / n).toFixed(2)}s" path="${d}"/></circle>`;
    return s;
  },
  txt(x, y, t, cls = 'ovt halo', a = 'start') {
    const L = t.split('|');
    return `<text class="${cls}" x="${x}" y="${y}" text-anchor="${a}">${L.map((l, i) => `<tspan x="${x}" dy="${i ? 15 : 0}">${l}</tspan>`).join('')}</text>`;
  }
};

const SECS = [];

function sec(n, t, ids) { SECS.push({ n, t, ids }); }

function parseSt(spec, i) {
  return spec.split(',').some(p => {
    if (p.endsWith('-')) return i >= +p.slice(0, -1);
    if (p.includes('-')) { const [a, b] = p.split('-').map(Number); return i >= a && i <= b; }
    return i === +p;
  });
}

    h += `</div>`;
  });

}

function go(i, first) {
  const s = SYN[st.id], n = s.steps.length;
  i = Math.max(0, Math.min(n - 1, i));
  const prevStep = first ? -1 : st.step;
  st.step = i;
  const stp = s.steps[i], svg = $('svg.scene');
  if (!svg) return;
  const view = stp.v || Object.keys(s.layers)[0];
  svg.classList.toggle('labs-on', st.labs);
  svg.querySelectorAll('.vw').forEach(g => g.classList.toggle('off', g.dataset.view !== view));
  // resaltados
  svg.querySelectorAll('[data-hl]').forEach(e => { e.getAttribute('data-hl').split(' ').forEach(c => c && e.classList.remove(c)); e.removeAttribute('data-hl'); });
  svg.querySelectorAll('.lab.show').forEach(e => e.classList.remove('show'));
  svg.querySelectorAll('.opt.show').forEach(e => e.classList.remove('show'));
  const leg = [];
  const vg = svg.querySelector(`.vw[data-view="${view}"]`);
  for (const id in (stp.on || {})) {
    const e = vg.querySelector('#' + CSS.escape(id)); if (!e) continue;
    const cls = stp.on[id].split(' ').map(c => c.length === 1 ? 'hl-' + c : c);
    cls.forEach(c => e.classList.add(c)); e.setAttribute('data-hl', cls.join(' '));
    const lb = vg.querySelector(`.lab[data-for="${id}"]`);
    if (lb) { if (!stp.nolab) lb.classList.add('show'); const c = cls.find(x => x.startsWith('hl-')); if (c) leg.push([COL[c[3]], lb.textContent]); }
  }
  (stp.labs || []).forEach(id => { const lb = vg.querySelector(`.lab[data-for="${id}"]`); lb && lb.classList.add('show'); });
  (stp.show || []).forEach(id => { const e = vg.querySelector('#' + id); e && e.classList.add('show'); });
  (stp.leg || []).forEach(x => leg.push([COL[x[0]] || x[0], x[1]]));
  // superposiciones
  svg.querySelectorAll('.ov').forEach(e => {
    const was = e.classList.contains('on');
    const inView = e.closest('.vw').dataset.view === view;
    const on = inView && parseSt(e.dataset.st, i + 1);
    e.classList.toggle('on', on);
    if (on && (!was || first)) {
      e.querySelectorAll('animate[begin="indefinite"],animateMotion[begin="indefinite"],animateTransform[begin="indefinite"]').forEach(a => { try { a.beginElement(); } catch (_) {} });
      e.querySelectorAll('.once').forEach(a => { a.style.animation = 'none'; a.getBBox && a.getBBox(); a.style.animation = ''; });
    }
  });
  $('#legend').innerHTML = leg.map(x => `<span><i style="background:${x[0]}"></i>${x[1]}</span>`).join('');
  $('#cnt').textContent = `${i + 1} / ${n}`;
  document.querySelectorAll('#prog button').forEach((b, k) => { b.className = k < i ? 'done' : k === i ? 'cur' : ''; });
  document.querySelectorAll('#steps .st').forEach((b, k) => { b.setAttribute('aria-current', k === i); b.classList.toggle('past', k < i); });
  if (!first && prevStep !== i) { const cur = document.querySelector('#steps .st[aria-current="true"]'); if (cur && window.innerWidth > 1180) cur.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}

function asocCount() {
  const all = document.querySelectorAll('.flip'), on = document.querySelectorAll('.flip.on').length;
  $('#asocCnt').textContent = `${on} / ${all.length}`;
  const b = $('#bReveal'); b.innerHTML = I.eye + (on === all.length ? 'Ocultar todas' : 'Mostrar todas');
  const n = $('#asocNote'); if (n) n.hidden = on < all.length;
}

function setPlay(on) {
  st.play = on; clearInterval(st.timer);
  const b = $('#bPlay'); if (b) { b.innerHTML = on ? I.pause : (st.id && st.step === SYN[st.id].steps.length - 1 ? I.replay : I.play); b.setAttribute('aria-label', on ? 'Pausar' : 'Reproducir'); }
  if (on) st.timer = setInterval(() => {
    const n = SYN[st.id].steps.length;
    if (st.step >= n - 1) { setPlay(false); return; }
    go(st.step + 1);
  }, 7000);
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  setPlay(false);
  $('.side').classList.remove('open');
  if (SYN[id]) { if (st.id !== id) { st.step = 0; st.tab = 'fisio'; } st.id = id; renderSyn(id); }
  else { st.id = null; renderHome(); }
  document.querySelectorAll('.side .it').forEach(b => b.setAttribute('aria-current', b.dataset.go === st.id));
  $('main').scrollTop = 0;
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-go]'); if (!t) return;

/* Ayudas de dibujo para las escenas */
const H = (x, y) => [+(274.8 + 0.54 * x).toFixed(1), +(43.6 + 0.54 * y).toFixed(1)];
Object.assign(U, {
  // destello de dolor
  burst(x, y, r = 14, c = '#e4513f', cls = 'blink') {
    let pts = [];
    for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, rr = i % 2 ? r * 0.45 : r; pts.push([(x + Math.cos(a) * rr).toFixed(1), (y + Math.sin(a) * rr).toFixed(1)]); }
    return `<polygon class="${cls}" points="${pts.map(p => p.join(',')).join(' ')}" fill="${c}" stroke="#fff" stroke-width="1.5"/>`;
  },
  // onda expansiva que se repite
  ring(x, y, r1, r2, c, dur = 2, w = 3, extra = '') {
    return `<circle cx="${x}" cy="${y}" r="${r1}" fill="none" stroke="${c}" stroke-width="${w}" ${extra}><animate attributeName="r" values="${r1};${r2}" dur="${dur}s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="${dur}s" repeatCount="indefinite"/></circle>`;
  },
  glow(x, y, r, c, op = .55) { return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity="${op}" filter="url(#glow)" class="blink"/>`; },
  arrow(d, c = '#04302B', w = 2.4, cls = '') { const m = { '#04302B': 'ahk', '#d1453b': 'ahr', '#1D8446': 'ahg', '#2f86c4': 'ahb' }[c] || 'ah'; return `<path class="${cls}" d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" marker-end="url(#${m})"/>`; },
  nerve(d, c = '#e8b630', w = 4, cls = 'flow') { return `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w + 3}" stroke-linecap="round" opacity=".25"/><path class="${cls}" d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`; },
  // panel recuadro con título
  panel(x, y, w, h, title, inner = '') {
    return `<g filter="url(#drop)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="#fff" stroke="#d9e4de"/></g><text x="${x + 12}" y="${y + 20}" font-size="11" font-weight="700" fill="#1D8446" letter-spacing="1.2">${title.toUpperCase()}</text>${inner}`;
  },
  // neurona estilizada (soma en x,y)
  neuron(x, y, s = 1, fill = '#f2c9bb', id = '', extra = '') {
    const d = [[-34, -22], [-26, -40], [6, -42], [30, -28], [-38, 8], [36, 4]].map(([dx, dy]) => `M${x} ${y}q${dx * .5 * s} ${dy * .3 * s} ${dx * s} ${dy * s}m0 0l${dx * .3 * s} ${-8 * s}m${-dx * .3 * s} ${8 * s}l${10 * s} ${dy * .25 * s}`).join('');
    return `<g ${id ? `id="${id}"` : ''} ${extra}><path d="${d}" fill="none" stroke="#c48d7f" stroke-width="${2.6 * s}" stroke-linecap="round"/><path d="M${x} ${y + 10 * s}L${x} ${y + 70 * s}" stroke="#c48d7f" stroke-width="${3.4 * s}" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="${13 * s}" fill="${fill}" stroke="#a3685b" stroke-width="${1.8 * s}"/><circle cx="${x}" cy="${y}" r="${4.5 * s}" fill="#a3685b"/></g>`;

/* Árbol dendrítico de Purkinje */
function purkTree(x, y, ang, len, depth, keep) {
  if (depth === 0 || len < 6) return '';
  const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
  let s = `M${x.toFixed(1)} ${y.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}`;
  const k = (depth * 7 + Math.round(x)) % 10;
  if (k < keep) {
    s += purkTree(x2, y2, ang - 0.42, len * 0.78, depth - 1, keep);
    s += purkTree(x2, y2, ang + 0.42, len * 0.78, depth - 1, keep);
  } else s += purkTree(x2, y2, ang + (k % 2 ? .2 : -.2), len * 0.8, depth - 1, keep);
  return s;
}

/* Mapa mental de la clasificación del síncope */
function MAPA() {
  const D = 3.2;
  const show = (t) => `<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;${(t / D).toFixed(2)};${Math.min(.99, t / D + .08).toFixed(2)};1" dur="${D}s" begin="indefinite" fill="freeze"/>`;
  const line = (d, c, t) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="400" stroke-dashoffset="400"><animate attributeName="stroke-dashoffset" values="400;400;0;0" keyTimes="0;${(t / D).toFixed(2)};${Math.min(.99, t / D + .18).toFixed(2)};1" dur="${D}s" begin="indefinite" fill="freeze"/></path>`;
  const node = (cx, cy, w, h, c, t1, t2, t) => `<g opacity="0">${show(t)}<g filter="url(#drop)"><rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="16" fill="${c}"/></g><text x="${cx}" y="${cy - 2}" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">${t1}</text><text x="${cx}" y="${cy + 18}" font-size="13" fill="#fff" opacity=".92" text-anchor="middle">${t2}</text></g>`;
  const leaf = (x, y, w, c, title, lines, t, bg = '#fff') => { const h = 30 + lines.length * 18; return `<g opacity="0">${show(t)}<g filter="url(#drop)"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${bg}" stroke="${c}" stroke-width="2"/></g><text x="${x + w / 2}" y="${y + 24}" font-size="15" font-weight="800" fill="${c === '#d1453b' && bg !== '#fff' ? '#d1453b' : '#04302B'}" text-anchor="middle">${title}</text>${lines.map((l, i) => `<text x="${x + w / 2}" y="${y + 44 + i * 18}" font-size="12.5" fill="#36504c" text-anchor="middle">${l}</text>`).join('')}</g>`; };
  const GN = '#1D8446', OR = '#e48a24', RD = '#d1453b';

  s += line('M418 250L388 250', GN, .3) + line('M542 250L572 250', RD, .3) + line('M480 312L480 372', OR, .3);
  s += line('M216 250C206 250 206 162 204 160', GN, 1.1) + line('M216 250C206 250 206 312 204 314', GN, 1.1);
  s += line('M744 250C752 250 752 150 758 148', RD, 1.1) + line('M744 250C752 250 752 248 758 248', RD, 1.1) + line('M744 250C752 250 752 360 758 362', RD, 1.1);
  s += line('M480 428C480 448 255 448 255 468', OR, 1.1) + line('M480 428L480 468', OR, 1.1) + line('M480 428C480 448 705 448 705 468', OR, 1.1);
  // centro
  s += `<g><g filter="url(#drop)"><circle cx="480" cy="250" r="66" fill="#04302B"/></g><circle cx="480" cy="250" r="66" fill="none" stroke="#3CC168" stroke-width="3" opacity=".6"><animate attributeName="r" values="66;76;66" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="2.4s" repeatCount="indefinite"/></circle>` +
    `<text x="480" y="246" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">Síncope</text><text x="480" y="268" font-size="12" fill="#a9cfbf" text-anchor="middle">hipoperfusión</text><text x="480" y="283" font-size="12" fill="#a9cfbf" text-anchor="middle">transitoria</text></g>`;
  s += node(302, 250, 172, 64, GN, 'Neuromediado', 'reflejo · el más frecuente', .5);
  s += node(658, 250, 172, 64, RD, 'Cardiogénico', 'el más peligroso', .5);
  s += node(480, 400, 250, 56, OR, 'Hipotensión ortostática', 'al ponerse de pie', .5);
  s += leaf(8, 104, 196, GN, 'Vasovagal', ['dolor, miedo, calor,', 'mucho tiempo de pie', 'pródromo: sudor, palidez'], 1.4);
  s += leaf(8, 280, 196, GN, 'Situacional', ['al toser, orinar,', 'defecar o tragar'], 1.6);
  s += leaf(758, 106, 196, RD, 'Arritmias', ['bloqueo AV,', 'taquicardia ventricular'], 1.4);
  s += leaf(758, 206, 196, RD, 'Estructural', ['estenosis aórtica,', 'miocardiopatía hipertrófica'], 1.6);
  s += leaf(758, 320, 196, RD, '¡Alerta!', ['en esfuerzo, acostado', 'o sin pródromo'], 1.9, '#fde9e6');

/* Monitor de la tríada de Cushing: cambia en tiempo real mientras sube la PIC */
function CUSHING() {
  const D = 12, L = `dur="${D}s" begin="indefinite" repeatCount="indefinite"`, n = 5;
  const stage = (x, y, vals, fs, col, anchor = 'start') => vals.map((v, i) => {
    const t0 = i / n, t1 = (i + 1) / n;
    const kv = i === 0 ? `values="1;1;0;0" keyTimes="0;${(t1 - .01).toFixed(3)};${t1.toFixed(3)};1"` : i === n - 1 ? `values="0;0;1;1" keyTimes="0;${(t0 - .01).toFixed(3)};${t0.toFixed(3)};1"` : `values="0;0;1;1;0;0" keyTimes="0;${(t0 - .01).toFixed(3)};${t0.toFixed(3)};${(t1 - .01).toFixed(3)};${t1.toFixed(3)};1"`;
    return `<text x="${x}" y="${y}" font-size="${fs}" font-weight="800" fill="${col}" text-anchor="${anchor}" opacity="${i ? 0 : 1}"><animate attributeName="opacity" ${kv} ${L}/>${v}</text>`;
  }).join('');
  // trazos que se desplazan; se cambia de trazo según la etapa
  const ecg = (gap) => { let d = 'M0 0'; for (let x = 0; x < 900; x += gap) d += `H${x + gap - 26}l4 -4l3 4h4l3 -26l4 40l3 -14h5`; return d; };
  const swap = (from, to) => `values="0;0;1;1;0;0" keyTimes="0;${(from - .01).toFixed(3)};${from.toFixed(3)};${(to - .01).toFixed(3)};${to.toFixed(3)};1"`;
  const trace = (d, y, col, op) => `<g opacity="${op.first ? 1 : 0}"><animate attributeName="opacity" ${op.kv} ${L}/><g><animateTransform attributeName="transform" type="translate" values="0 ${y};-300 ${y}" dur="3s" repeatCount="indefinite"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.2"/></g></g>`;
  const ecgs = [[44, 0, .4], [64, .4, .7], [96, .7, 1]].map(([g, f, t], i) => trace(ecg(g), 0, '#3CC168', { first: i === 0, kv: i === 0 ? `values="1;1;0;0" keyTimes="0;${(t - .01).toFixed(3)};${t.toFixed(3)};1"` : i === 2 ? `values="0;0;1;1" keyTimes="0;${(f - .01).toFixed(3)};${f.toFixed(3)};1"` : swap(f, t) }));
  let reg = 'M0 0', irr = 'M0 0';
  for (let x = 0; x < 900; x += 60) reg += `q15 -16 30 0t30 0`;
  const pat = [[30, 18], [30, 6], [60, 0], [30, 22], [30, 4], [20, 12], [70, 0], [30, 20]];
  for (let x = 0, k = 0; x < 900; k++) { const [w, h] = pat[k % pat.length]; irr += h ? `q${w / 2} ${-h} ${w} 0` : `h${w}`; x += w; }
  const resp = trace(reg, 0, '#7fd0ff', { first: true, kv: `values="1;1;0;0" keyTimes="0;.59;.6;1"` }) + trace(irr, 0, '#7fd0ff', { first: false, kv: `values="0;0;1;1" keyTimes="0;.59;.6;1"` });
  const row = (y, h) => `<rect x="574" y="${y}" width="362" height="${h}" rx="10" fill="#0a2222"/>`;
  let s = `<defs><clipPath id="cu-e"><rect x="700" y="300" width="228" height="60"/></clipPath><clipPath id="cu-r"><rect x="700" y="388" width="228" height="58"/></clipPath></defs>`;
  s += `<g filter="url(#drop)"><rect x="560" y="112" width="386" height="424" rx="16" fill="#04302B"/></g><text x="578" y="138" font-size="11" font-weight="700" fill="#3CC168" letter-spacing="1.2">MONITOR · TRÍADA DE CUSHING</text>`;
  s += `<circle cx="926" cy="133" r="5" fill="#ff5a4a"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle>`;
  // PIC
  s += row(150, 62) + `<text x="588" y="172" font-size="12" font-weight="700" fill="#f2a54a">PIC</text><text x="588" y="200" font-size="11" fill="#a9cfbf">mmHg</text>` + stage(688, 200, [15, 22, 28, 35, 42], 30, '#f2a54a', 'end') +
    `<rect x="706" y="176" width="216" height="12" rx="6" fill="#1d3b3b"/><rect x="706" y="176" width="40" height="12" rx="6" fill="#f2a54a"><animate attributeName="width" values="40;216" ${L}/></rect><text x="706" y="204" font-size="10.5" fill="#a9cfbf">normal &lt; 15 · sube la presión</text>`;
  // PA
  s += row(220, 62) + `<text x="588" y="242" font-size="12" font-weight="700" fill="#ff8a7a">PA ↑</text><text x="588" y="270" font-size="11" fill="#a9cfbf">mmHg</text>` + stage(800, 268, ['130/80', '150/88', '172/95', '195/104', '214/112'], 30, '#ff8a7a', 'end') +
    `<text x="812" y="252" font-size="11" fill="#a9cfbf">sube para seguir</text><text x="812" y="268" font-size="11" fill="#a9cfbf">perfundiendo</text>`;
  // FC + ECG
  s += row(290, 80) + `<text x="588" y="312" font-size="12" font-weight="700" fill="#ffd24a">FC ↓</text><text x="588" y="358" font-size="11" fill="#a9cfbf">lpm</text>` + stage(676, 352, [88, 76, 64, 52, 44], 30, '#ffd24a', 'end') +
    `<g clip-path="url(#cu-e)"><g transform="translate(700 340)">${ecgs.join('')}</g></g>`;
  // Respiración
  s += row(378, 80) + `<text x="588" y="400" font-size="12" font-weight="700" fill="#7fd0ff">Resp</text><text x="588" y="420" font-size="11" fill="#a9cfbf">patrón</text>` +
    stage(588, 446, ['regular', 'regular', 'regular', 'irregular', 'irregular'], 13, '#7fd0ff') + `<g clip-path="url(#cu-r)"><g transform="translate(700 424)">${resp}</g></g>`;
  s += `<text x="578" y="482" font-size="12.5" font-weight="700" fill="#fff">Al subir la PIC:</text><text x="578" y="502" font-size="12" fill="#a9cfbf">la PA sube, la FC baja y la respiración se vuelve</text><text x="578" y="520" font-size="12" fill="#a9cfbf">irregular por compresión del tronco</text>`;
  // la masa sigue creciendo en el cerebro
  s += `<circle cx="318" cy="176" r="38" fill="#7a2d2d" stroke="#4d1010" stroke-width="2"><animate attributeName="r" values="38;50" ${L}/></circle><circle cx="318" cy="176" r="60" fill="#f5e7a8" opacity=".3"><animate attributeName="r" values="60;74" ${L}/></circle>`;
  s += U.tag(36, 30, 'Signo tardío|la presión ya comprime el tronco', { fs: 12.5, fill: '#d1453b', col: '#fff' });
  return s;
}

    return `<text x="${x}" y="200" font-size="18" font-weight="800" fill="#04302B">${titulo}</text>` +

      wrapT(x, 414, hace, 50, { fs: 13, fill: '#04302B' }) +

      wrapT(x, titulo === 'Kernig' ? 510 : 492, aparece, 50, { fs: 13, fill: '#04302B' }) +

  syn('meningeo', {

    s += [[200, 286], [258, 288], [210, 322]].map(([x, y]) => `<circle cx="${T(x)}" cy="${y}" r="7" class="amp"/>`).join('');
    s += `<path class="reg n8" id="oi-n8${m ? 'R' : 'L'}" d="${p([[250, 320], [320, 330], [380, 320], [420, 314]])}"/>`;
    s += `<path class="n8c" d="${p([[284, 372], [330, 356], [380, 334]])}"/>`;
    return s;
  };
  function build() {
    let s = `<rect x="408" y="220" width="144" height="200" rx="40" class="stemv"/><text x="480" y="402" font-size="11" font-weight="700" fill="#8f5a4f" text-anchor="middle">TRONCO</text>`;

/* Macrófago que desprende y fagocita la mielina, segmento por segmento */
function PHAGO() {
  const D = 10, L = `dur="${D}s" begin="indefinite" repeatCount="indefinite"`;
  const kt = (arr) => arr.map(x => (x / D).toFixed(3)).join(';');
  let s = `<path d="M40 260H920" stroke="#e9c3b6" stroke-width="10" stroke-linecap="round"/>`;
  // segmentos: 0,1,4,5,6 intactos; 2 y 3 se destruyen
  for (let i = 0; i < 7; i++) {
    const x = 60 + i * 124;
    if (i === 2 || i === 3) s += `<rect x="${x}" y="238" width="110" height="44" rx="22" fill="#efe9e6" stroke="#c9c2bd" stroke-width="1.6" stroke-dasharray="5 5"/>`;
    const t0 = i === 2 ? 3.6 : 6.8;
    s += `<rect x="${x}" y="238" width="110" height="44" rx="22" fill="#f6e7a8" stroke="#c9a63b" stroke-width="1.6">${i === 2 || i === 3 ? `<animate attributeName="opacity" values="1;1;0;0" keyTimes="${kt([0, t0, t0 + 1.4, D])}" ${L}/>` : ''}</rect>`;
  }
  s += `<path d="M40 260H920" stroke="#d7a596" stroke-width="5" stroke-linecap="round"/>`;
  // anticuerpos que caen y se pegan
  [190, 318, 372, 442, 496, 600].forEach((x, i) => {
    const fade = x > 300 && x < 420 ? 3.6 : x > 420 && x < 545 ? 6.8 : 0;
    s += `<g><animateTransform attributeName="transform" type="translate" values="0 -120;0 -120;0 0;0 0" keyTimes="${kt([0, i * .15, 1.2 + i * .15, D])}" ${L}/>${fade ? `<animate attributeName="opacity" values="1;1;0;0" keyTimes="${kt([0, fade, fade + 1.2, D])}" ${L}/>` : ''}${Y(x, 222, 1.1, '#7a52b3', 0)}</g>`;
  });
  // fragmentos de mielina que entran al macrófago
  const frag = (x0, t0, tx) => [0, 1, 2, 3, 4].map(k => `<rect x="${x0 + k * 18}" y="${270 + (k % 2) * 6}" width="12" height="7" rx="3" fill="#f3d36b" stroke="#c9a63b" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="${kt([0, t0, t0 + .2, t0 + 1.2, t0 + 1.5, D])}" ${L}/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;${tx - x0 - k * 18} ${46 - (k % 2) * 6};${tx - x0 - k * 18} ${46 - (k % 2) * 6}" keyTimes="${kt([0, t0, t0 + 1.4, D])}" ${L}/></rect>`).join('');
  s += frag(316, 3.6, 360) + frag(440, 6.8, 484);
  // macrófago
  const mac = `<path d="M-38 -6C-46 -34 -12 -50 10 -40C34 -50 54 -26 44 -4C56 16 34 34 8 30C-14 38 -46 22 -38 -6Z" fill="#c9dcb5" stroke="#6f8f52" stroke-width="2"><animate attributeName="d" values="M-38 -6C-46 -34 -12 -50 10 -40C34 -50 54 -26 44 -4C56 16 34 34 8 30C-14 38 -46 22 -38 -6Z;M-44 -22C-50 -46 -20 -52 6 -50C34 -56 58 -40 50 -16C62 8 38 30 10 28C-14 36 -48 18 -44 -22Z;M-38 -6C-46 -34 -12 -50 10 -40C34 -50 54 -26 44 -4C56 16 34 34 8 30C-14 38 -46 22 -38 -6Z" dur="1.6s" repeatCount="indefinite"/></path><circle cx="6" cy="0" r="12" fill="#8fae6f"/>` +
    [[-18, 8, 3.8], [22, 10, 4.4], [-6, 18, 7], [28, -6, 7.6]].map(([x, y, t]) => `<circle cx="${x}" cy="${y}" r="5" fill="#f3d36b" stroke="#c9a63b" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="${kt([0, t + .6, t + .8, D - .3, D])}" ${L}/></circle>`).join('');
  s += `<g><animateTransform attributeName="transform" type="translate" values="200 420;200 420;364 318;364 318;488 318;488 318;488 318" keyTimes="${kt([0, 1.2, 3.2, 5.2, 6.4, 9.4, D])}" ${L}/>${mac}</g>`;
  // rótulos por fase
  const cap = (t0, t1, n, t) => `<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="${kt([0, t0, t0 + .2, t1 - .2, t1, D])}" ${L}/>${U.tag(36, 22, t, { fs: 12.5, fill: '#04302B', col: '#fff' })}</g>`;
  s += cap(0, 1.6, 1, '1 · Los anticuerpos marcan la mielina|la «confunden» con el microbio') + cap(1.6, 3.6, 2, '2 · Llega el macrófago|reconoce la mielina marcada') + cap(3.6, D, 3, '3 · Desprende la vaina y se la come|fagocitosis, segmento por segmento: axón desnudo');
  s += U.txt(480, 340, '', 'ovt s halo', 'middle') + U.tag(36, 466, 'Nervios periféricos: el cerebro y la médula están sanos', { fs: 12.5, fill: '#1D8446', col: '#fff' });
  s += `<text x="248" y="320" font-size="11.5" fill="#5d7470">mielina</text><text x="560" y="320" font-size="11.5" font-weight="700" fill="#8a6b14" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="${kt([0, 5, 5.4, D])}" ${L}/>axón sin mielina</text>`;
  return s;
}

    smell: () => `<path d="M24 8C20 20 12 34 14 42C16 48 26 48 30 44" fill="${SK}" stroke="${SD}" stroke-width="2"/>${[0, 1, 2].map(i => `<path d="M${40 + i * 6} 44q-4 -8 0 -14t0 -14" stroke="#9fb0aa" stroke-width="2" fill="none">${an('opacity', '1;.1;1', `${1.2 + i * .3}s`)}</path>`).join('')}<path d="M36 12l22 36" stroke="${R}" stroke-width="3"/>`,
    mask: () => head() + eyes(35) + `<path d="M26 44h12" stroke="${SD}" stroke-width="2"/><path d="M20 26q6 -3 10 0M34 26q6 -3 10 0" stroke="#8d6a5d" stroke-width="1.6" fill="none"/><text x="56" y="14" font-size="9" fill="#5d7470">sin</text>`,
    glass: () => `<path d="M18 10h28l-4 44H22z" fill="#eaf5fc" stroke="${B}" stroke-width="2"/><path d="M20 26h24l-3 26H23z" fill="#f3d36b" opacity=".8"/><circle cx="28" cy="40" r="2" fill="#fff">${an('cy', '48;30', '1.6s')}</circle>`,
    spiral: () => { let s = ''; for (let i = 0; i <= 90; i++) { const a = i * .2, r = 2 + a * 1.4, j = Math.sin(i * 1.7) * 1.4; s += (i ? 'L' : 'M') + (32 + Math.cos(a) * r + j).toFixed(1) + ' ' + (32 + Math.sin(a) * r + j).toFixed(1); } return `<path d="${s}" fill="none" stroke="${V}" stroke-width="1.8" stroke-dasharray="400" stroke-dashoffset="400">${an('stroke-dashoffset', '400;0', '3s')}</path>`; },
    loc: () => `<g>${at('rotate', '0 32 58;0 32 58;-84 32 58;-84 32 58', '2.8s')}${fig(B)}</g><path d="M6 60h52" stroke="#9fb0aa" stroke-width="2"/>`,
    seizure: () => `<g class="shake" style="animation-duration:.25s">${fig(R)}</g>${bolt(54, 6, .8, A)}`,
    absence: () => head() + `<path d="M23 35h6M35 35h6" stroke="${K}" stroke-width="2"/><g>${an('opacity', '1;1;0;0;1', '2.4s')}<circle cx="26" cy="35" r="2" fill="${K}"/><circle cx="38" cy="35" r="2" fill="${K}"/></g>${mouth('M27 44h10')}<text x="50" y="16" font-size="12" font-weight="800" fill="${B}">…</text>`,
    recover: () => `<rect x="10" y="22" width="40" height="22" rx="4" fill="#fff" stroke="${K}" stroke-width="2.4"/><rect x="50" y="28" width="4" height="10" rx="1" fill="${K}"/><rect x="13" y="25" width="0" height="16" rx="2" fill="${G}">${an('width', '0;34;34', '3s')}</rect>`,
    tongue: () => face({ m: 'M26 44q6 4 12 0' }) + `<path d="M36 44q4 4 0 7" fill="${R}">${an('opacity', '1;.4;1', '1s')}</path>`,
    sweat: () => head(32, 34, 17, '#efe2dc') + eyes(35) + mouth('M27 45q5 -3 10 0') + [0, 1].map(i => `<path d="M${16 + i * 30} 26q-3 6 0 8q3 -2 0 -8z" fill="#5aa8dc"><animateTransform attributeName="transform" type="translate" values="0 0;0 14" dur="${1.2 + i * .4}s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="${1.2 + i * .4}s" repeatCount="indefinite"/></path>`).join(''),
    amnesia: () => `<rect x="4" y="26" width="56" height="12" rx="6" fill="#e3ece7"/><rect x="4" y="26" width="20" height="12" rx="6" fill="#5aa8dc"/><rect x="40" y="26" width="20" height="12" rx="6" fill="#5aa8dc"/><text x="32" y="36" font-size="11" font-weight="800" fill="${R}" text-anchor="middle">?<animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></text>`,
    acute: () => `<rect x="8" y="12" width="48" height="40" rx="6" fill="#fff" stroke="${R}" stroke-width="2.4"/><rect x="8" y="12" width="48" height="10" rx="4" fill="${R}"/><path d="M16 42L28 40L32 28L38 44L48 30" stroke="${R}" stroke-width="2.4" fill="none" stroke-dasharray="60" stroke-dashoffset="60">${an('stroke-dashoffset', '60;0', '1.6s')}</path>`,
    sleepwake: () => `<g>${at('rotate', '0 32 32;180 32 32;360 32 32', '4s')}<circle cx="32" cy="12" r="8" fill="#ffd24a"/><path d="M28 48a8 8 0 1 0 8 -8a6 6 0 1 1 -8 8z" fill="#5d6f8f"/></g>`,
    inatt: () => `<text x="32" y="26" font-size="9.5" font-weight="700" fill="${K}" text-anchor="middle">dic · nov · oct</text><text x="32" y="44" font-size="9.5" font-weight="700" fill="${R}" text-anchor="middle">sep · ¿…?<animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></text>`,
    scramble: () => ['p', 'a', 'l', 'a'].map((c, i) => `<text x="${14 + i * 12}" y="38" font-size="16" font-weight="800" fill="${V}" text-anchor="middle">${c}<animateTransform attributeName="transform" type="translate" values="0 0;${(i % 2 ? 1 : -1) * 8} ${(i % 2 ? -8 : 8)};0 0" dur="${1.4 + i * .2}s" repeatCount="indefinite"/></text>`).join(''),
    zzz: () => face({ closed: 1, m: 'M28 44h8' }) + [0, 1, 2].map(i => `<text x="${46 + i * 5}" y="${20 - i * 6}" font-size="${8 + i * 2}" font-weight="800" fill="${B}">z<animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="${i * .4}s" repeatCount="indefinite"/></text>`).join(''),
    pupil: () => eye(32, 32, 24, 4, an('r', '4;10;10;4', '3s')),
    vitals: () => `<rect x="4" y="8" width="56" height="48" rx="8" fill="#04302B"/><text x="10" y="22" font-size="9" font-weight="800" fill="#ff8a7a">PA ↑</text><text x="34" y="22" font-size="9" font-weight="800" fill="#ffd24a">FC ↓</text><path d="M8 42q6 -10 12 0h6q4 -14 8 0h20" fill="none" stroke="#7fd0ff" stroke-width="2" stroke-dasharray="80" stroke-dashoffset="80">${an('stroke-dashoffset', '80;0', '2s')}</path>`,
    abduct: () => `<path d="M6 32Q18 20 30 32Q18 44 6 32ZM34 32Q46 20 58 32Q46 44 34 32Z" fill="#fff" stroke="#8d6a5d" stroke-width="1.6"/><circle cx="18" cy="32" r="5" fill="#111">${an('cx', '18;10;18', '2s')}</circle><circle cx="46" cy="32" r="5" fill="#111"/><path d="M40 48l12 0" stroke="${R}" stroke-width="2.4" marker-end="url(#ahr)"/>`,
    kernig: () => `<path d="M6 52h52" stroke="#9fb0aa" stroke-width="2"/><circle cx="10" cy="44" r="5" fill="${SK}"/><path d="M14 46h18L36 28" stroke="${V}" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M36 28L54 28" stroke="${V}" stroke-width="5" stroke-linecap="round">${at('rotate', '0 36 28;24 36 28;0 36 28', '2s')}</path>${bolt(52, 40, .6)}`,
    brudz: () => `<path d="M6 52h52" stroke="#9fb0aa" stroke-width="2"/><g>${at('rotate', '0 16 46;-30 16 46;0 16 46', '2s')}<circle cx="10" cy="44" r="5" fill="${SK}"/></g><path d="M16 46h16" stroke="${V}" stroke-width="5" stroke-linecap="round"/><path d="M32 46L42 46L54 46" stroke="${V}" stroke-width="5" stroke-linecap="round" fill="none">${an('d', 'M32 46L42 46L54 46;M32 46L42 32L54 46;M32 46L42 46L54 46', '2s')}</path>`,
    petechiae: () => `<rect x="6" y="10" width="52" height="44" rx="10" fill="${SK}"/>${[[16, 20], [28, 30], [40, 18], [48, 38], [20, 42], [36, 44], [12, 32]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="2.4" fill="#a0182b">${an('opacity', '0;1;1', `${1.6 + i * .2}s`)}</circle>`).join('')}`,
    confused: () => face({ m: 'M27 44q5 -2 10 0' }) + `<path d="M44 14a6 6 0 1 1 6 6" stroke="${V}" stroke-width="2.4" fill="none">${at('rotate', '0 50 14;360 50 14', '2s')}</path>`,
    ear: () => `<path d="M30 10C44 8 50 20 48 32C46 44 36 46 36 54C36 58 30 60 28 56" fill="${SK}" stroke="${SD}" stroke-width="2"/><path d="M34 22c6 0 8 8 4 14" stroke="${SD}" stroke-width="2" fill="none"/>${[0, 1, 2].map(i => `<path d="M${18 - i * 5} ${24 - i * 3}q-4 8 0 16" stroke="${B}" stroke-width="2" fill="none">${an('opacity', '1;.1;1', `${1 + i * .3}s`)}</path>`).join('')}`,
    dixhall: () => `<path d="M6 46h52" stroke="#9fb0aa" stroke-width="2"/><rect x="18" y="38" width="38" height="8" rx="3" fill="${V}"/><g>${at('rotate', '0 18 40;-30 18 40;-30 18 40;0 18 40', '3s')}<circle cx="8" cy="40" r="7" fill="${SK}" stroke="${SD}"/></g>`,
    eyeopen: () => `<path d="M4 32Q16 20 28 32Q16 44 4 32Z" fill="#fff" stroke="#8d6a5d" stroke-width="1.6"/><circle cx="16" cy="32" r="5" fill="#111">${an('cy', '32;26;26;32', '2.4s')}</circle><path d="M36 32Q48 20 60 32Q48 44 36 32Z" fill="#fff" stroke="#8d6a5d" stroke-width="1.6"/><circle cx="48" cy="32" r="5" fill="#111"/><path d="M36 32Q48 20 60 32L60 18L36 18Z" fill="${SK}" stroke="#8d6a5d" stroke-width="1.4">${an('d', 'M36 32Q48 20 60 32L60 18L36 18Z;M36 32Q48 42 60 32L60 18L36 18Z;M36 32Q48 42 60 32L60 18L36 18Z;M36 32Q48 20 60 32L60 18L36 18Z', '2.4s')}</path>`,
    drool: () => head() + eyes(35) + `<path d="M24 46q6 -4 14 -2" stroke="${SD}" stroke-width="2" fill="none"/><path d="M24 48q-2 5 0 7q2 -2 0 -7z" fill="#9fcde8"><animateTransform attributeName="transform" type="translate" values="0 0;0 10" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.4s" repeatCount="indefinite"/></path>`,
    tingle: () => `${hand()}${[[24, 14], [34, 12], [44, 22], [20, 40]].map(([x, y], i) => `<path d="M${x} ${y - 4}v8M${x - 4} ${y}h8" stroke="${A}" stroke-width="2">${an('opacity', '0;1;0', `${.8 + i * .2}s`)}</path>`).join('')}`,
    backpain: () => fig(V) + `<g>${an('opacity', '1;.2;1', '.9s')}<circle cx="32" cy="36" r="6" fill="${R}" opacity=".7"/></g>`,
    lungs: () => `<g>${at('scale', '1;1.08;1', '2.4s')}<path d="M28 14C18 18 8 34 10 48c2 6 12 6 16 0V14zM36 14C46 18 56 34 54 48c-2 6 -12 6 -16 0V14z" fill="#f6c3bb" stroke="#c76a6a" stroke-width="1.8"/></g><path d="M32 6V22" stroke="#c76a6a" stroke-width="3"/>`,
    reflex: () => `<path d="M8 22h30v12H8z" fill="${SK}" stroke="${SD}" stroke-width="1.6"/><path d="M34 26L40 54" stroke="${SK}" stroke-width="10" stroke-linecap="round"/><g>${at('rotate', '20 56 46;0 56 46;20 56 46', '1.4s')}<path d="M56 46L42 38" stroke="#7a6a5d" stroke-width="3"/><rect x="38" y="33" width="8" height="10" rx="2" fill="#9fb0aa"/></g><path d="M18 10l10 10M28 10l-10 10" stroke="${R}" stroke-width="2.6">${an('opacity', '0;1;1', '1.4s')}</path>`,
    fatigue: () => [0, 1, 2, 3, 4].map(i => `<rect x="${8 + i * 10}" y="${52 - (36 - i * 7)}" width="7" height="${36 - i * 7}" rx="2" fill="${V}" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;${(i * .16).toFixed(2)};${(i * .16 + .05).toFixed(2)};1" dur="3s" repeatCount="indefinite"/></rect>`).join('') + `<path d="M6 54h52" stroke="#9fb0aa" stroke-width="2"/>`,
    swallow: () => face({ m: 'M27 43q5 2 10 0' }) + `<path d="M32 48V60" stroke="${SD}" stroke-width="2"/><circle cx="32" cy="50" r="3" fill="${A}">${an('cy', '48;56;48', '1.6s')}</circle><path d="M26 54l12 0" stroke="${R}" stroke-width="2.4"/>`,
    dot: () => `<circle cx="32" cy="32" r="10" fill="${G}">${an('r', '8;14;8', '1.6s')}</circle>`
  };
  const MAP = [
    [/^sin náuseas|^sin hipoacusia|^sin bradicinesia|^sin déficit/, 'check'], [/vi par/, 'abduct'], [/espiral/, 'spiral'], [/mordedura/, 'tongue'], [/sin empatía/, 'noempathy'],
    [/trueno/, 'thunder'], [/orbitario/, 'eyepain'], [/hemicr|cefalea|peor de su vida/, 'headache'], [/retroauric/, 'ear'], [/dolor lumbar/, 'backpain'],
    [/aura|fotopsia/, 'aura'], [/proyectil|náusea|vómito|emesis/, 'nausea'], [/foto/, 'photo'],
    [/^dura|crisis 15|segundos|horas|minutos/, 'clock'], [/alodinia/, 'comb'], [/banda/, 'band'], [/parkinsonismo bilateral/, 'slow'], [/^bilateral/, 'bilateral'],
    [/leve a moderada/, 'meter'], [/pericraneal/, 'palpate'], [/nocturno/, 'moon'], [/inquietud/, 'pacing'],
    [/epífora|lagrimeo|ojo rojo/, 'tear'], [/rinorrea/, 'nose'], [/no puede cerrar|fenómeno de bell/, 'eyeopen'], [/ptosis|párpado/, 'ptosis'],
    [/fiebre/, 'thermo'], [/50 años|> 50/, 'age'], [/rigidez de nuca/, 'neck'], [/papiledema/, 'fundus'],
    [/debilidad que sube|paresia simétrica/, 'ascend'], [/signos cruzados/, 'crossed'], [/déficit transitorio/, 'hemi'],
    [/déficit|focal|hemiparesia|debilidad súbita|paresia/, 'hemi'], [/asimetr|no arruga|surco naso|cara asimétrica|diplejía facial|toma toda/, 'facedroop'],
    [/comida|líquido/, 'drool'], [/disartria|afasia|habla|pseudobulbar/, 'speech'], [/hemianopsia/, 'hemianop'],
    [/amaurosis|pérdida visual/, 'visionloss'], [/mirada desviada/, 'gaze'], [/babinski/, 'babinski'], [/soplo/, 'bruit'],
    [/pulso irregular|arritmia|disautonomía/, 'ecg'], [/diplopía|visión doble|doble/, 'diplopia'], [/nistagmo vertical/, 'nystv'], [/nistagmo/, 'nystagmus'],
    [/giratoria|vértigo/, 'vertigo'], [/dismetría|ataxia y dismetría/, 'dysmetria'], [/ataxia|inestabilidad|desequilibrio/, 'sway'],
    [/olvida|memoria conservada/, 'memorycheck'], [/repite/, 'repeat'], [/se pierde|desorientación/, 'lost'], [/anomia/, 'anomia'],
    [/gira la cabeza/, 'headturn'], [/anosognosia/, 'anosog'], [/fluctua|fluctúa/, 'fluct'], [/poco estructuradas/, 'bugs'], [/alucinaciones/, 'halluc'],
    [/actúa sus sueños/, 'rem'], [/caídas/, 'fall'], [/ortostática/, 'ortho'], [/ejecutivas|planea/, 'exec'], [/apatía/, 'apathy'],
    [/escalonado/, 'steps'], [/marcha magnética|pasos cortos|base amplia|festinación/, 'gait'], [/desinhibición/, 'disinh'],
    [/hiperoralidad/, 'mouthfood'], [/liberación/, 'grasp'], [/incontinencia/, 'drop'], [/demencia/, 'memory'], [/giro en bloque/, 'turn'],
    [/titubeo/, 'headtremor'], [/temblor|tiembla/, 'tremor'], [/rigidez|rueda dentada/, 'cog'], [/hiposmia/, 'smell'], [/hipomimia/, 'mask'],
    [/alcohol/, 'glass'], [/espiral/, 'spiral'], [/lentitud|bradicinesia|lento/, 'slow'],
    [/movimientos tónico/, 'seizure'], [/ausencias/, 'absence'], [/pérdida.*conciencia|pérdida del estado|pérdida súbita/, 'loc'],
    [/recuperación/, 'recover'], [/mordedura/, 'tongue'], [/pródromo/, 'sweat'], [/amnesia/, 'amnesia'], [/inicio agudo/, 'acute'],
    [/somnolencia diurna/, 'sleepwake'], [/inatención/, 'inatt'], [/desorganizado/, 'scramble'], [/hipoactivo|somnolencia/, 'zzz'],
    [/midriasis/, 'pupil'], [/cushing/, 'vitals'], [/vi par/, 'abduct'], [/kernig/, 'kernig'], [/brudzinski/, 'brudz'], [/petequias/, 'petechiae'],
    [/confusión/, 'confused'], [/hipoacusia|acúfenos/, 'ear'], [/dix-hallpike/, 'dixhall'], [/parestesias|hipoestesia/, 'tingle'],
    [/respirar|respiración/, 'lungs'], [/hiporreflexia|arreflexia/, 'reflex'], [/fatigable|empeora con el uso/, 'fatigue'], [/tragar|disfagia/, 'swallow'],
    [/examen|normal|pupilas normales|reflejos y sensibilidad|sin déficit/, 'check']
  ];
  L.nystv = () => L.nystagmus(1);
  L.memorycheck = (t) => /conservada/.test(t) ? L.check() : L.memory();
  return (text) => {
    const t = text.toLowerCase();
    const m = MAP.find(([re]) => re.test(t));
    const k = m ? m[1] : 'dot';
    return `<svg class="sic" viewBox="0 0 64 64" aria-hidden="true">${L[k](t)}</svg>`;
  };
})();
</script>
